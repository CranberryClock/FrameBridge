name: TCW-004 short validation
on: [push, pull_request]
jobs:
  short-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm --filter @framebridge/demo-web exec vite build
      - run: cmake -S . -B out/tcw004-cpp -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build out/tcw004-cpp --target framebridge-bridge-codec
      - run: .\out\tcw004-cpp\framebridge-bridge-codec.exe
