name: TCW-004 short validation
on: [push, pull_request]
jobs:
  short-validation:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm --filter @framebridge/demo-web exec vite build
      - run: cmake -S . -B out/tcw004-cpp -G "Visual Studio 17 2022" -A x64
      - run: cmake --build out/tcw004-cpp --config Release --target framebridge-bridge-codec
      - run: .\out\tcw004-cpp\Release\framebridge-bridge-codec.exe
